<!DOCTYPE html>
<html lang="en">
<head>
    <title>Register Page</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">

    <script>
        function userResgistration() {
            
            let student = {
                studId  : document.getElementById("studId").value,
                studName: document.getElementById("studName").value,
                doj     : document.getElementById("doj").value,
                gender  : document.getElementById("gender").value,
                country : document.getElementById("country").value,
                emailId : document.getElementById("emailId").value,
                password: document.getElementById("password").value
            };

            console.log(student);
        }
    </script>

</head>
<body style="background-color: Cornsilk;">
    <center> 
    <form>
        <table>
            <tr>
                <td colspan="2" align="center"><h3 style="color: blue;">User Registeration</h3></td>
            </tr>
            <tr>
                <td> StudId </td>
                <td> <input type="text" id="studId" /> </td>
            </tr>
            <tr>
                <td> StudName </td>
                <td> <input type="text" id="studName" /> </td>
            </tr>
            <tr>
                <td> DOJ </td>
                <td> <input type="date" id="doj" /> </td>
            </tr>
            <tr>
                <td> Gender </td>
                <td>
                    <select id="gender">
                        <option selected value="">Select Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Others">Others</option>
                    </select> 
                </td>
            </tr>
            <tr>
                <td> Country </td>
                <td>
                    <select id="country">
                        <option selected value="">Select Country</option>
                        <option value="INDIA">INDIA</option>
                        <option value="USA">USA</option>
                        <option value="Nepal">Nepal</option>
                        <option value="SriLanka">Sri Lanka</option>
                        <option value="Butan">Butan</option>
                    </select> 
                </td>
            </tr>
            <tr>
                <td> Email-Id </td>
                <td> <input type="text" id="emailId" /> </td>
            </tr>
            <tr>
                <td> Password </td>
                <td> <input type="password" id="password" /> </td>
            </tr>
            <tr>
                <td></td>
                <td> <button type="button" onclick="userResgistration()" class="btn btn-primary">Register</button> Already User? <a href="Login.html">SignIn</a> </td>
            </tr>
        </table>        
    </form>   
    </center> 
</body>
</html>
