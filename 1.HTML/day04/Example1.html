<!DOCTYPE html>
<html lang="en">
<head>
    <title>ImageDemo</title>
</head>
<body>
    <h1>Local Image (Image is Inside the VS Code)</h1>
    <img src="images/image1.jpg" alt="image1.jpg" height="200px" width="200px" />
    <br/>

    <h1>Web Image (Image is from the Website)</h1>
    <img 
    src="https://images.pexels.com/photos/66274/sunset-poppy-backlight-66274.jpeg" 
    alt="sunset.jpg" height="200px" width="200px" />
    <br/><br/>

    <!--Add Video Tag-->
    <video width="320" height="240" controls>
        <source src="movie.mp4" type="video/mp4">
        <source src="movie.ogg" type="video/ogg">
        Your browser does not support the video tag.
    </video>

</body>
</html>
