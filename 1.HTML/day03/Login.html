<!DOCTYPE html>
<html lang="en">
<head>
    <title>Login Page</title>
    
    <!--Boostrap 3.4.1 CDN Link, CDN - Content Delivery Network -->
    <link rel="stylesheet" 
    href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">

</head>
<body style="background-color: Cornsilk;">

    <div style="margin-left: 75px; margin-top: 50px;">
        
        <h3 style="color: blue;">Login Form</h3>    
    <form>
        <table>
            <tr>
                <td> 
                    <div class="input-group">
                        <span class="input-group-addon">
                            <i  class="glyphicon glyphicon-user"></i>
                        </span>
                        <input type="text" class="form-control" 
                        name="emailId" id="emailId" placeholder="Email-Id" />
                    </div> <br/>
                </td>
            </tr>
            <tr>
                
                <td> 
                    <div class="input-group">
                        <span class="input-group-addon">
                            <i class="glyphicon glyphicon-lock"></i>
                        </span>

                        <input type="password" class="form-control" 
                        name="password" id="password" placeholder="Password" />
                    </div> 
                    <br/>
                </td>
            </tr>
            <tr>
                <td> <button class="btn btn-primary">Login</button> New User? <a href="Register.html">SignUp</a> </td>
            </tr>
        </table>        
    </form>  
    </div>  
</body>
</html>
