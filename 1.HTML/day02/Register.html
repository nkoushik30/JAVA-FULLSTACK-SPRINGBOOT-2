<!DOCTYPE html>
<html lang="en">
<head>
    <title>Register Page</title>
</head>
<body bgcolor="Cornsilk">
        
    <form>
        <table>
            <tr>
                <td colspan="2" align="center"><h3 style="color: blue;">User Registeration</h3></td>
            </tr>
            <tr>
                <td> StudId </td>
                <td> <input type="text" name="studId" id="studId" /> </td>
            </tr>
            <tr>
                <td> StudName </td>
                <td> <input type="text" name="studName" id="studName" /> </td>
            </tr>
            <tr>
                <td> DOJ </td>
                <td> <input type="date" name="doj" id="doj" /> </td>
            </tr>
            <tr>
                <td> Gender </td>
                <td>
                    <select name="gender" id="gender">
                        <option selected value="">Select Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Others">Others</option>
                    </select> 
                </td>
            </tr>
            <tr>
                <td> Country </td>
                <td>
                    <select name="country" id="country">
                        <option selected value="">Select Country</option>
                        <option value="INDIA">INDIA</option>
                        <option value="USA">USA</option>
                        <option value="Nepal">Nepal</option>
                        <option value="SriLanka">Sri Lanka</option>
                        <option value="Butan">Butan</option>
                    </select> 
                </td>
            </tr>
            <tr>
                <td> Email-Id </td>
                <td> <input type="text" name="emailId" id="emailId" /> </td>
            </tr>
            <tr>
                <td> Password </td>
                <td> <input type="password" name="password" id="password" /> </td>
            </tr>
            <tr>
                <td></td>
                <td> <button>Register</button> Already User? <a href="Login.html">SignIn</a> </td>
            </tr>
        </table>        
    </form>    
</body>
</html>
